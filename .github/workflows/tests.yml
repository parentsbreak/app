name: Tests

# Corre en cada Pull Request y a mano. No toca el deploy de GitHub Pages ni la base real:
# Supabase está simulado en tests/support/app.js.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    # 25 minutos (27/10/2026): con 15, dos corridas se cancelaron porque instalar Chromium tardó 10.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
