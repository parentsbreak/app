<!-- Siempre clara (21/10/2026, Paulina y Delfina): fondo blanco aunque el celular o la compu estén en
     modo oscuro. "only light" además le dice a Chrome que no la oscurezca por su cuenta. -->
<meta name="color-scheme" content="only light">

<style>
:root{
  color-scheme: only light;
  --bg:#F6F5FB; --paper:#FFFFFF; --ink:#312F45; --ink-soft:#6C6A84; --line:#E3E1EE;
  --accent:#757CBB; --accent-soft:#E7E8F5; --clay:#DF8386; --clay-soft:#FBE7E8; --clay-text:#B8555A;
  --good:#3E7D4F; --good-soft:#E3EFE3; --warn:#B9862E; --warn-soft:#F7EBD4; --bad:#AB4B41; --bad-soft:#F5E1DD;
  --shadow-sm: 0 1px 2px rgba(49,47,69,.05), 0 1px 4px rgba(49,47,69,.05);
  --shadow-md: 0 6px 20px rgba(49,47,69,.10);
  --gutter: 14px;
  --ease: 180ms cubic-bezier(.4,0,.2,1);
}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
*{box-sizing:border-box;}
html{overflow-x:hidden;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
.wrap{margin:0;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--clay-text);margin-bottom:6px;}
h1{font-size:27px;font-weight:600;}
.sub{color:var(--ink-soft);font-size:14px;margin-top:5px;max-width:640px;line-height:1.5;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.who{font-size:12.5px;color:var(--ink-soft);text-align:right;}
.who button{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;font-size:12.5px;padding:0;margin-top:3px;}
.homeintro{margin:12px 0 28px;}
.homeintro h1{font-size:26px;margin-top:4px;}
.backbtn{background:var(--paper);border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:all var(--ease);font-family:'Inter',sans-serif;}
.backbtn:hover{border-color:var(--accent);color:var(--accent);}
.modtitle{font-size:24px;margin:14px 0 20px;}
.subnav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:6px 0 20px;flex-wrap:wrap;}
.subtab{font-weight:600;font-size:13.5px;color:var(--ink-soft);background:none;border:none;padding:9px 4px;cursor:pointer;border-bottom:2px solid transparent;margin-right:16px;font-family:'Inter',sans-serif;transition:color var(--ease), border-color var(--ease);}
.subtab:hover{color:var(--accent);}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent);}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:var(--gutter);box-shadow:var(--shadow-sm);animation:fadeIn var(--ease);}
.card h2{font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0 0 10px;}
.card h2:first-child{margin-top:0;}
.card>.helper:first-child{margin-top:0;}
.card-section-title{font-size:14px;font-weight:700;font-family:'Baloo 2',sans-serif;margin:18px 0 10px;}
.card-section-title:first-child{margin-top:0;}
.helper{color:var(--ink-soft);font-size:13px;margin:4px 0 12px;line-height:1.5;}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
input[type=text],input[type=tel],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;color:var(--ink);font-family:'Inter',sans-serif;
  transition:border-color var(--ease), box-shadow var(--ease);
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button:focus-visible{border-radius:8px;}
textarea{resize:vertical;min-height:54px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gutter);}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gutter);}
.field{margin-bottom:12px;}
.mesnav{display:inline-flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow-sm);}
.mesnav button{width:30px;height:30px;border-radius:8px;border:none;background:none;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background var(--ease), color var(--ease);}
.mesnav button:hover{background:var(--bg);color:var(--accent);}
.mesnav button svg{width:15px;height:15px;}
.mesnav-label{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14.5px;color:var(--ink);padding:0 10px;min-width:150px;text-align:center;}
.agenda-legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin:2px 0 12px;flex-wrap:wrap;}
.agenda-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
.dot-sinasignar{border:1.5px dashed var(--ink-soft);}
.dot-pendiente{background:var(--warn);}
.dot-confirmada{background:var(--accent);}
.agenda-scroll{overflow-x:auto;padding-bottom:6px;}
.agenda-grid{display:grid;position:relative;min-width:fit-content;}
.agenda-colhead{text-align:center;font-size:12px;font-weight:600;padding:0 4px 8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.agenda-eje{position:relative;}
.agenda-hora{position:absolute;font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;transform:translateY(-50%);}
.agenda-col{position:relative;border-left:1px solid var(--line);height:100%;}
.agenda-card{position:absolute;left:3px;right:3px;border-radius:8px;padding:5px 7px;overflow:hidden;cursor:pointer;transition:box-shadow var(--ease);}
.agenda-card:hover{box-shadow:var(--shadow-sm);}
.agenda-card-hora{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
.agenda-card-sub{font-size:11px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.agenda-card.sinasignar{background:#fff;border:2px dashed var(--line);color:var(--ink-soft);}
.agenda-card.pendiente{background:var(--warn-soft);color:#7A5A16;}
.agenda-card.confirmada{background:var(--accent-soft);border:1px solid var(--accent);color:#3A3768;}
.agenda-card.cancelada{opacity:.5;text-decoration:line-through;background:var(--bg);border:1px solid var(--line);}
.agenda-nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);}
.agenda-nowlabel{position:absolute;left:0;right:2px;transform:translateY(-50%);font-size:10px;font-weight:700;text-align:right;color:var(--accent);background:var(--paper);z-index:4;font-family:'IBM Plex Mono',monospace;}
.agenda-tier-label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;margin:10px 0 6px;}
.agenda-ninera-pick{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;}
.agenda-ninera-pick input{margin:0;}
.agenda-ninerarow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
.agenda-ninerarow:last-child{border-bottom:none;}
.autocomplete-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:var(--shadow-md);z-index:30;}
.autocomplete-item{padding:9px 12px;font-size:14px;cursor:pointer;color:var(--ink);}
.autocomplete-item:hover,.autocomplete-item.hl{background:var(--accent-soft);}
.autocomplete-empty{padding:9px 12px;font-size:13px;color:var(--ink-soft);}
.timepick{display:flex;align-items:center;gap:5px;}
.timepick select{width:auto;flex:1;min-width:0;text-align:center;font-family:'IBM Plex Mono',monospace;}
.timepick span{color:var(--ink-soft);font-weight:600;}
.moneyfield{position:relative;}
.moneyfield input{padding-left:22px;padding-right:32px;}
.moneyfield::before{content:'$';position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:14px;pointer-events:none;}
/* '/h' solo en los campos que son por hora (06/10/2026: salía también en cobros de traslado, pagos totales, saldos y gastos). */
.moneyfield.por-hora::after{content:'/h';position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:12.5px;pointer-events:none;}
.navitem{position:relative;}
.navdot{position:absolute;top:6px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--clay-text);border:2px solid #5B5FA0;}
.preciosugerido{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:8px;}
.q{background:var(--accent-soft);border-radius:9px;padding:9px 12px;margin-bottom:8px;font-size:13.5px;color:var(--ink);line-height:1.45;}
.scorebar{display:flex;gap:6px;margin-top:10px;}
.scorebtn{flex:1;text-align:center;padding:9px 0;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);}
.scorebtn.selected{background:#666EAE;border-color:#666EAE;color:#fff;}
.scorelabels{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
.flag-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line);}
.flag-row:last-child{border-bottom:none;}
.flag-row input{margin-top:3px;}
.flag-row span{font-size:13.5px;line-height:1.4;}
.flag-row.critical span::after{content:" · crítico";color:var(--bad);font-size:11px;font-weight:600;}
.refrow{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin-bottom:8px;align-items:center;}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
.zona-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.zona-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:6px 12px;font-size:13px;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;transition:background var(--ease),border-color var(--ease);}
.zona-chip input{margin:0;width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
.zona-chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent);}
.zona-chip.suelta{border-style:dashed;}
.zona-chip-nota{font-size:11px;color:var(--warn);}
.zona-detalle{margin-top:6px;font-size:12px;color:var(--ink-soft);line-height:1.6;}
.zona-detalle summary{cursor:pointer;font-size:12px;}
.zona-detalle b{color:var(--ink);font-weight:600;}
.refrow .chk{gap:6px;}
/* Casilla con texto largo (25/10/2026, "Este día no hubo servicio…" del registro): el texto se
   acomoda en varias líneas y la cajita es grande para tocarla en el celular. Con .chk a secas
   (nowrap) se cortaba en "canceló la familia" y el modal hacía scroll de costado. */
.chk.chk-largo{white-space:normal;align-items:flex-start;line-height:1.35;}
.chk.chk-largo input[type=checkbox]{width:24px;height:24px;flex:none;margin:-3px 0 0;accent-color:var(--accent);}
/* Botones del aviso de precio a mano del registro (25/10/2026): "Usar el nuevo monto" / "Mantener". */
.sit-precio-botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.sit-precio-botones .smallbtn{min-height:36px;}
.smallbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;}
.smallbtn:hover{border-color:var(--accent);color:var(--accent);}
.smallbtn.danger:hover{border-color:var(--bad);color:var(--bad);}
.resultcard{display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
.gauge{width:88px;height:88px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.gauge .inner{width:68px;height:68px;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .num{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:600;}
.gauge .max{font-size:10px;color:var(--ink-soft);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:12.5px;font-weight:700;}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.badge.good{background:var(--good-soft);color:var(--good);}
.badge.warn{background:var(--warn-soft);color:var(--warn);}
.badge.bad{background:var(--bad-soft);color:var(--bad);}
.badge.brand{background:var(--clay-soft);color:var(--clay-text);}
.badge.accent{background:var(--accent-soft);color:var(--accent);}
.resultnote{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.btn{font-weight:600;font-size:14px;border-radius:10px;padding:11px 20px;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:transform var(--ease), box-shadow var(--ease), background var(--ease);}
.btn.primary{background:#666EAE;color:#fff;box-shadow:var(--shadow-sm);}
.btn.primary:hover:not(:disabled){background:#5D64A0;box-shadow:var(--shadow-md);}
.btn.primary:active:not(:disabled){transform:scale(.98);}
.btn.primary:disabled{background:#C7C6DA;cursor:not-allowed;}
.btn[aria-busy="true"],.smallbtn[aria-busy="true"],.pcard-delete[aria-busy="true"]{cursor:progress;opacity:.75;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.danger{background:var(--clay-text);color:#fff;}
.btn.danger:hover{background:#9C4448;}
.pantallacarga{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);padding:24px;text-align:center;z-index:50;}
.pantallacarga-logo{width:min(220px,60vw);height:auto;animation:fadeIn 400ms ease both;}
/* Símbolo de carga (15/10/2026): late suave mientras carga. Definido por la altura. */
.pantallacarga-simbolo{height:min(140px,22vh);width:auto;}
.simbolo-latido{animation:latido 1.6s ease-in-out infinite;}
@keyframes latido{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.07);opacity:.82;}}
@media (prefers-reduced-motion: reduce){ .simbolo-latido{animation:none;} }
.carga-modulo{position:fixed;transform:translate(-50%,-50%);z-index:40;pointer-events:none;}
.carga-modulo img{height:40px;width:auto;display:block;}
.pantallacarga-msg{font-size:14px;color:var(--ink-soft);max-width:340px;line-height:1.5;}
.pantallacarga-msg b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px;}
.pantallacarga .btn{margin-top:4px;}
.confirmoverlay{position:fixed;inset:0;background:rgba(49,47,69,.35);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;transition:opacity 180ms ease;padding:20px;}
.confirmoverlay.show{opacity:1;}
.confirmbox{background:var(--paper);border-radius:16px;padding:22px 24px;max-width:380px;width:100%;box-shadow:var(--shadow-md);transform:translateY(8px) scale(.98);transition:transform 180ms cubic-bezier(.2,.8,.2,1);position:relative;}
.modal-close{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:none;background:var(--bg);color:var(--ink-soft);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background var(--ease), color var(--ease);}
.modal-close:hover{background:var(--clay-soft);color:var(--clay-text);}
.confirmoverlay.show .confirmbox{transform:translateY(0) scale(1);}
.confirmmsg{font-size:14.5px;color:var(--ink);line-height:1.5;margin-bottom:18px;}
.confirmbtns{display:flex;justify-content:flex-end;gap:10px;}
.warnbox{background:var(--warn-soft);border:1px solid #E4C888;border-radius:9px;padding:10px 13px;font-size:13px;color:#7A5A16;margin-top:14px;line-height:1.5;}
/* Borrador sin guardar (21/10/2026): "Tenés un borrador de hace X minutos. ¿Seguir?" */
.borrador-aviso{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--ink);}
.borrador-aviso .borrador-botones{display:flex;gap:8px;flex-wrap:wrap;}
.okbox{background:var(--good-soft);border:1px solid #B9D9BE;border-radius:9px;padding:10px 13px;font-size:13px;color:var(--good);margin-top:14px;line-height:1.5;}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow-sm);transition:transform var(--ease), box-shadow var(--ease);position:relative;}
.pcard-delete{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:none;background:#fff;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.5;transition:opacity var(--ease), background var(--ease), color var(--ease);box-shadow:var(--shadow-sm);}
.pcard-delete:hover,.pcard-delete:focus-visible{opacity:1;background:var(--clay-soft);color:var(--clay-text);}
.pcard-delete svg{width:13px;height:13px;}

/* El login y sus pantallas (Un paso más, Confirmá que sos vos, contraseña nueva) scrollean: con el
   aviso "La app se mudó" o en un celular chico el contenido mide más que la pantalla y, sin scroll,
   "Entrar" quedaba fuera de la vista sin forma de alcanzarlo (31/10/2026). */
.loginstage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.loginbrand{position:relative;overflow:hidden;background:var(--accent);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:60px;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.6;animation:drift 20s ease-in-out infinite;}
.blob-a{width:380px;height:380px;background:var(--clay);top:-100px;right:-80px;animation-duration:22s;}
.blob-b{width:320px;height:320px;background:#fff;bottom:-120px;left:-60px;opacity:.16;animation-duration:26s;animation-delay:-6s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-20px) scale(1.06);}66%{transform:translate(-20px,25px) scale(0.96);}}
.loginbrand-logo{height:44px;filter:brightness(0) invert(1);position:relative;z-index:1;margin-bottom:28px;animation:logoIn 600ms cubic-bezier(.2,.8,.2,1);}
@keyframes logoIn{from{opacity:0;transform:translateY(-8px) scale(.94);}to{opacity:1;transform:translateY(0) scale(1);}}
.loginbrand h1{position:relative;z-index:1;color:#fff;font-size:32px;max-width:380px;line-height:1.25;animation:fadeIn 500ms 100ms both;}
.loginbrand p{position:relative;z-index:1;color:rgba(255,255,255,.85);font-size:14.5px;max-width:340px;line-height:1.6;margin-top:14px;animation:fadeIn 500ms 180ms both;}
/* Centrado con márgenes automáticos y no con align-items:center: si el formulario no entra, los
   márgenes quedan en 0 y no se corta arriba (con center, lo de arriba quedaba fuera del scroll). */
.loginformside{display:flex;align-items:flex-start;justify-content:center;padding:40px;}
.loginwrap{width:100%;max-width:340px;margin:auto 0;animation:fadeIn 500ms 200ms both;}
.loginwrap h2{font-size:22px;margin-bottom:6px;}
.loginwrap .helper{margin-bottom:26px;}
.inputicon{position:relative;}
.inputicon svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-soft);pointer-events:none;}
.inputicon input{padding-left:34px;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:2px;}
.spinner.dark{border-color:var(--line);border-top-color:var(--accent);}
@keyframes spin{to{transform:rotate(360deg);}}
@media (max-width:760px){.loginstage{grid-template-columns:1fr;grid-template-rows:auto 1fr;}.loginbrand{padding:36px 28px;min-height:180px;}.loginbrand h1{font-size:22px;}.loginbrand p{display:none;}.loginformside{padding:28px;}.loginwrap{margin:0;}}

.inter-pool-fila{display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap;}
.inter-pool-fila:last-child{border-bottom:none;}
.inter-elegir{display:flex;flex-direction:column;gap:10px;}
.inter-elegir button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:56px;padding:10px 14px;}
.inter-elegir button .helper{margin:0;font-weight:400;}
/* Variantes de precio (23/10/2026): botones de un toque y ajuste libre, en el registro y en el
   Cierre de los fijos. */
.variantes-box{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 12px;background:var(--bg);}
.variantes-titulo{font-weight:700;font-size:13.5px;color:var(--ink);margin:0 0 8px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.variantes-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 8px;}
.variante-chip{min-height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit;font-size:14px;text-align:left;max-width:100%;}
.variante-chip span{font-size:12px;color:var(--ink-soft);}
.variante-chip.on{background:var(--accent-soft);border-color:var(--accent);}
.variante-chip.on b{color:var(--accent);}
.variante-libre-abrir{min-height:44px;}
.variante-libre{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;}
.variante-libre-btns{display:flex;gap:8px;flex-wrap:wrap;}
.variante-libre-btns .smallbtn{min-height:44px;}
/* Por cobrar / Por pagar: una tarjeta por familia o niñera, con el detalle para marcar solo una
   parte (23/10/2026). Renglones de 44 px y casillas grandes: lo usan desde el celular. */
.fin-pend-cabeza{cursor:pointer;min-height:44px;min-width:0;flex:1 1 230px;}
.fin-pend-cabeza:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
.fin-pend-vermas{color:var(--accent);font-size:12.5px;margin-top:3px;}
.fin-pend-acciones{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-left:auto;}
.fin-pend-monto{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.fin-det{padding:6px 0 14px;border-bottom:1px solid var(--line);}
.fin-det-caja{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;}
.fin-det-dia{margin-top:6px;}
.fin-det-fecha{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:capitalize;margin:6px 0 0;}
.fin-det-fila{font-weight:400;display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer;font-size:15px;color:var(--ink);}
.fin-det-dia .fin-det-fila:last-child{border-bottom:none;}
.fin-det-fila.fin-det-sub{padding-left:26px;font-size:13.5px;color:var(--ink-soft);}
.fin-det-fila input[type=checkbox]{width:26px;height:26px;flex:none;margin:0;accent-color:var(--accent);}
.fin-det-fila .fin-det-texto{flex:1;min-width:0;overflow-wrap:anywhere;}
.fin-det-variantes{display:block;font-size:12.5px;color:var(--ink-soft);}
.fin-det-fila .pago-monto{font-family:'IBM Plex Mono',monospace;font-weight:600;white-space:nowrap;}
.fin-det-saldos{border-top:1px solid var(--line);margin-top:8px;}
.fin-det-botones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.fin-det-botones button{min-height:44px;flex:1 1 auto;}
.fin-det-botones button:disabled{background:var(--line);border-color:var(--line);color:var(--ink-soft);cursor:not-allowed;opacity:1;}
.fin-det-ayuda{margin:-2px 0 6px;font-size:12.5px;}
.fin-det-pagado-campo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;}
.fin-det-pagado-campo input{max-width:160px;min-height:44px;font-size:16px;}
/* Fijos automáticos (06/10/2026): días previstos en la Agenda, revisión en Hoy, previsto del mes. */
.agenda-previsto{display:inline-block;font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px dashed var(--accent);padding:1px 6px;border-radius:100px;flex-shrink:0;}
.autoconf-fila{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap;}
.autoconf-fila:last-child{border-bottom:none;}
.autoconf-btns{display:flex;gap:6px;flex:0 1 auto;min-width:0;flex-wrap:wrap;}
.autoconf-txt{flex:1 1 220px;min-width:0;} /* en el celular los botones bajan a otra línea */
.fin-previsto{border-left:3px dashed var(--accent);font-size:13.5px;}
.conc-fila{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);}
.conc-fila .helper{font-weight:400;}
.conc-fila input{margin-top:3px;width:18px;height:18px;flex-shrink:0;}
.conc-dudosa{background:var(--warn-soft);margin:0 -10px;padding:10px;border-radius:8px;border-bottom-color:transparent;margin-bottom:4px;}
.conc-motivo{font-size:12px;font-weight:600;color:var(--warn);margin-top:3px;}
.conc-hecha{opacity:.5;text-decoration:line-through;}
.pago-total-fila{border-bottom:none;border-top:2px solid var(--line);margin-bottom:6px;}
.pendbanner{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;text-align:left;width:100%;font-family:'Inter',sans-serif;transition:transform var(--ease), border-color var(--ease);box-shadow:var(--shadow-sm);}
.pendbanner:hover{transform:translateY(-2px);border-color:#C8C6DC;}
.pendbanner-left{display:flex;align-items:center;gap:12px;}
.pendbanner-num{font-family:'Baloo 2',sans-serif;font-size:19px;font-weight:700;color:var(--clay-text);}
.pendbanner-label{font-size:13px;color:var(--ink);}
.pendbanner-link{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;}
.pillfilters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.pillbtn{background:#fff;border:1px solid var(--line);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;transition:all var(--ease);}
.pillbtn:hover{border-color:var(--accent);color:var(--accent);}
.pillbtn.selected{background:#666EAE;border-color:#666EAE;color:#fff;}
.agendarow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
.agendarow:last-child{border-bottom:none;}
.agendatime{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);min-width:82px;line-height:1.3;flex-shrink:0;}
.agendaicon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:1;}
.agendaicon svg{width:13px;height:13px;}
.agendaicon.sitting{background:var(--accent-soft);color:var(--accent);}
.agendaicon.traslado{background:var(--clay-soft);color:var(--clay-text);}
.agendabody{flex:1;min-width:0;}
.agendatype{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.timeline{position:relative;}
.timeline::before{content:'';position:absolute;top:14px;bottom:14px;left:108px;width:2px;background:var(--line);}
.timeline .agendarow{border-bottom:none;padding:8px 0;}
.timeline .agendarow.pasado{opacity:.5;}
.timeline .agendarow.pasado .agendaicon{background:var(--bg);color:var(--ink-soft);}
.timeline-now{display:flex;align-items:center;gap:12px;padding:2px 0;}
.timeline-now .agendatime{color:var(--clay-text);font-weight:700;min-width:82px;}
.timeline-now-line{flex:1;height:2px;background:var(--clay);border-radius:2px;position:relative;}
.timeline-now-line::before{content:'';position:absolute;left:-3px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--clay);}
.dayrow{display:flex;gap:6px;margin-bottom:10px;}
.daybtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all var(--ease);}
.daybtn.selected{background:#666EAE;border-color:#666EAE;color:#fff;}
.tiporow{display:flex;gap:8px;margin-bottom:14px;}
.tipobtn{flex:1;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;font-family:'Inter',sans-serif;transition:all var(--ease);}
.tipobtn.selected{background:#666EAE;border-color:#666EAE;color:#fff;}
.createhint{margin-top:5px;}
.createbtn{background:none;border:1px solid var(--clay);color:var(--clay-text);font-size:11.5px;font-weight:600;border-radius:7px;padding:5px 10px;cursor:pointer;font-family:'Inter',sans-serif;}
.createbtn:hover{background:var(--clay-soft);}
.addrhint{font-size:11px;color:var(--accent);margin:-6px 0 10px;}
.extratoggle{background:none;border:1px dashed var(--accent);color:var(--accent);font-weight:600;font-size:12.5px;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:2px;}
.extrabox{margin-top:10px;padding:12px;background:var(--accent-soft);border-radius:9px;}
.durbtn{padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;}
.durbtn:hover{border-color:var(--accent);color:var(--accent);}
.summary3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gutter);margin-bottom:var(--gutter);}
.summary4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter);margin-bottom:var(--gutter);}
.summarycard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.mesbar{display:flex;justify-content:space-between;align-items:flex-end;margin:var(--gutter) 0 10px;gap:var(--gutter);flex-wrap:wrap;}
.precio-fam{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;padding:8px 12px;background:var(--accent-soft);border-radius:9px;font-size:13px;color:var(--ink-soft);}
@media (max-width:640px){.summary3{grid-template-columns:1fr;}.summary4{grid-template-columns:1fr 1fr;}}
@media (max-width:760px){
  .mobile-topbar{display:flex;}
  .appshell{position:static;flex-direction:column;height:auto;padding-top:52px;}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:250px;max-width:82vw;transform:translateX(-100%);transition:transform 220ms ease;z-index:50;box-shadow:0 0 40px rgba(0,0,0,.25);}

  #aviso-volviste{top:52px;}
}
@media (max-width:480px){.statrow{grid-template-columns:1fr;}}
@media (max-width:760px){

    font-size:16px; /* evita que iOS haga zoom automático al tocar un campo (el umbral es 16px) */

}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}.refrow{grid-template-columns:1fr;}.fichadl{grid-template-columns:1fr;}.hometiles{grid-template-columns:1fr;grid-auto-rows:auto;}.tile.hero{grid-column:span 1;grid-row:span 1;}}

  .toast{max-width:none;font-size:16px;padding:16px 18px;}
}
